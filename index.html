<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f5e8e3">

<title>دعوة زفاف سمير وهدى</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    background:#f5e8e3;
}

body{
    margin:0;
    overflow-x:hidden;
    background:#f5e8e3;
    color:#4a2d20;
}

body.locked{
    overflow:hidden;
}

img{
    display:block;
    max-width:100%;
    height:auto;
}


/* =====================================================
   COVER
   ===================================================== */

#coverScreen{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    z-index:99999;

    background:#f5e8e3;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    overflow:hidden;

    transition:
        opacity .9s ease,
        visibility .9s ease;
}

#coverScreen img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

#coverScreen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

#coverHint{
    position:absolute;

    left:50%;
    bottom:6%;

    transform:translateX(-50%);

    color:#563628;

    font-family:Arial,sans-serif;
    font-size:15px;

    white-space:nowrap;

    opacity:.85;

    animation:hintPulse 2.2s ease-in-out infinite;
}

@keyframes hintPulse{

    0%,100%{
        opacity:.45;
        transform:translateX(-50%) translateY(0);
    }

    50%{
        opacity:1;
        transform:translateX(-50%) translateY(-5px);
    }
}


/* =====================================================
   INVITATION
   ===================================================== */

#invitation{
    opacity:0;
    visibility:hidden;
    transition:opacity .9s ease;
}

#invitation.open{
    opacity:1;
    visibility:visible;
}

.section{
    width:100%;
    position:relative;
    overflow:hidden;
}


/* =====================================================
   OPENING IMAGE
   ===================================================== */

.opening-section{
    width:100%;
    line-height:0;
}

.opening-section img{
    width:100%;
    height:auto;
}


/* =====================================================
   MAIN BACKGROUND
   ===================================================== */

.invitation-area{
    position:relative;
    width:100%;

    background-image:url("background.png");

    background-size:cover;
    background-position:center top;
    background-attachment:fixed;
}

.invitation-area::before{
    content:"";

    position:absolute;
    inset:0;

    background:rgba(255,255,255,.02);

    pointer-events:none;

    z-index:0;
}

.invitation-content{
    position:relative;
    z-index:1;

    width:100%;
}


/* =====================================================
   MUSIC
   ===================================================== */

.music-section{
    width:100%;

    padding:18px 0 28px;

    text-align:center;
    line-height:0;
}

.music-control{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    width:min(42%,170px);

    height:auto;

    padding:0;
    margin:0 auto;

    border:0;
    outline:0;

    background:transparent;

    cursor:pointer;

    overflow:hidden;

    -webkit-tap-highlight-color:transparent;

    touch-action:manipulation;

    line-height:0;
}

.music-control img{
    display:block;

    width:100%;
    height:auto;

    object-fit:contain;

    transition:
        transform .2s ease,
        opacity .2s ease;
}

.music-control:active img{
    transform:scale(.94);
}


/* =====================================================
   TRANSPARENT IMAGES
   ===================================================== */

.transparent-image-section{
    width:100%;

    line-height:0;

    text-align:center;
}

.transparent-image-section img{
    width:100%;
    height:auto;

    margin:0 auto;
}


/* =====================================================
   COUNTDOWN
   ===================================================== */

.countdown-section{
    width:100%;

    padding:55px 20px 45px;

    text-align:center;
}

.save-date{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:clamp(25px,7vw,48px);

    font-weight:400;

    letter-spacing:1px;

    direction:ltr;

    margin-bottom:25px;
}

.countdown{
    width:min(92%,680px);

    margin:0 auto;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:clamp(12px,4vw,35px);

    direction:ltr;

    flex-wrap:wrap;
}

.countdown-item{
    text-align:center;
    min-width:55px;
}

.countdown-number{
    display:block;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:clamp(32px,8vw,60px);

    line-height:1;

    font-weight:400;

    color:#4a2d20;
}

.countdown-label{
    display:block;

    margin-top:9px;

    font-family:Arial,sans-serif;

    font-size:clamp(11px,3vw,16px);

    color:#4a2d20;
}

.countdown-separator{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:clamp(28px,7vw,48px);

    line-height:1;

    margin-top:-18px;
}


/* =====================================================
   BEFORE VENUE
   ===================================================== */

.before-venue-section{
    width:100%;

    line-height:0;

    text-align:center;
}

.before-venue-section img{
    width:min(68%,420px);

    height:auto;

    margin:0 auto;

    border-radius:28px;

    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(55,30,18,.14);
}


/* =====================================================
   VENUE
   ===================================================== */

.venue-section{
    width:100%;

    padding:55px 20px 70px;

    text-align:center;
}

.venue-title{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:clamp(29px,8vw,52px);

    font-weight:400;

    line-height:1.3;

    margin-bottom:25px;
}

.venue-photo{
    width:min(92%,650px);

    margin:0 auto 28px;

    border-radius:22px;

    border:
        1px solid rgba(168,118,60,.55);

    box-shadow:
        0 14px 40px rgba(55,30,18,.18);
}

.maps-button{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    min-width:220px;

    padding:15px 28px;

    border-radius:999px;

    text-decoration:none;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #a8783c,
            #c49b5c
        );

    font-family:Arial,sans-serif;

    font-size:16px;

    box-shadow:
        0 10px 28px rgba(100,60,25,.20);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.maps-button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 14px 32px rgba(100,60,25,.28);
}


/* =====================================================
   INSTRUCTIONS
   ===================================================== */

.instructions-section{
    width:100%;

    line-height:0;

    text-align:center;
}

.instructions-section img{
    width:100%;
    height:auto;

    margin:0 auto;
}


/* =====================================================
   FINAL
   ===================================================== */

.final-section{
    min-height:45dvh;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:80px 20px;
}

.final-content{
    width:100%;
    text-align:center;
}

.final-title{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:clamp(35px,9vw,62px);

    font-weight:400;

    line-height:1.5;

    color:#4a2d20;

    margin-bottom:14px;
}

.final-names{
    direction:ltr;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:clamp(27px,7vw,48px);

    line-height:1.4;

    color:#4a2d20;

    letter-spacing:.5px;
}

.final-names span{
    display:inline-block;

    margin:0 8px;

    font-size:.8em;
}

.final-hearts{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:8px;

    direction:ltr;

    margin-bottom:12px;
}

.final-hearts span{
    display:inline-block;

    color:#9b6335;

    line-height:1;
}

.final-hearts span:nth-child(1),
.final-hearts span:nth-child(3){
    font-size:22px;
}

.final-hearts span:nth-child(2){
    font-size:32px;
}

.final-hearts-bottom{
    margin-top:18px;
    margin-bottom:0;

    transform:scale(.85);
}


/* =====================================================
   REVEAL
   ===================================================== */

.reveal{
    opacity:0;

    transform:translateY(30px);

    transition:
        opacity .9s ease,
        transform .9s ease;
}

.reveal.visible{
    opacity:1;

    transform:translateY(0);
}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:480px){

    .countdown-section{
        padding-top:45px;
    }

    .countdown{
        gap:9px;
    }

    .countdown-item{
        min-width:48px;
    }

    .countdown-separator{
        font-size:24px;
        margin-top:-15px;
    }
}


/* =====================================================
   DESKTOP
   ===================================================== */

@media(min-width:900px){

    body{
        background:#d9cfca;
    }

    #invitation{
        max-width:620px;

        margin:0 auto;

        background:transparent;

        box-shadow:
            0 0 50px rgba(0,0,0,.18);
    }

    .invitation-area{
        background-attachment:scroll;
    }

    #coverScreen{
        background:#d9cfca;
    }

    #coverScreen img{
        max-width:620px;

        margin:0 auto;

        box-shadow:
            0 0 50px rgba(0,0,0,.25);
    }
}


/* =====================================================
   REDUCED MOTION
   ===================================================== */

@media(prefers-reduced-motion:reduce){

    html{
        scroll-behavior:auto;
    }

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }
}

</style>
</head>


<body class="locked">


<!-- =====================================================
     COVER
     ضع صورة الواجهة باسم cover.png
     ===================================================== -->

<div id="coverScreen"
     role="button"
     tabindex="0"
     aria-label="فتح دعوة الزفاف">

    <img
        src="cover.png"
        alt="واجهة دعوة الزفاف">

    <div id="coverHint">
        اضغط هنا لفتح الدعوة
    </div>

</div>


<!-- =====================================================
     MUSIC
     ===================================================== -->

<audio id="weddingMusic"
       preload="auto"
       loop
       playsinline>

    <source
        src="music.mp3"
        type="audio/mpeg">

</audio>


<!-- =====================================================
     INVITATION
     ===================================================== -->

<main id="invitation">


    <!-- =================================================
         OPENING IMAGE
         ================================================= -->

    <section class="opening-section reveal">

        <img
            src="opening.png"
            alt="الصورة الافتتاحية">

    </section>


    <!-- =================================================
         MAIN INVITATION AREA
         ================================================= -->

    <div class="invitation-area">


        <!-- =================================================
             MUSIC
             ================================================= -->

        <section class="music-section reveal">

            <button
                id="musicToggle"
                class="music-control"
                type="button"
                aria-label="إيقاف الموسيقى"
                aria-pressed="true">

                <img
                    id="musicIcon"
                    src="music-icon.png"
                    alt="تشغيل وإيقاف الموسيقى">

            </button>

        </section>


        <div class="invitation-content">


            <!-- =================================================
                 INVITATION IMAGE 1
                 ================================================= -->

            <section class="transparent-image-section reveal">

                <img
                    src="invitation-1.png"
                    alt="رسالة الدعوة">

            </section>


            <!-- =================================================
                 INVITATION IMAGE 2
                 ================================================= -->

            <section class="transparent-image-section reveal">

                <img
                    src="invitation-2.png"
                    alt="تفاصيل الدعوة">

            </section>


            <!-- =================================================
                 COUNTDOWN
                 ================================================= -->

            <section class="countdown-section reveal">

                <div class="save-date">
                    Save the date
                </div>


                <div
                    class="countdown"
                    aria-label="العد التنازلي">


                    <div class="countdown-item">

                        <span
                            id="days"
                            class="countdown-number">
                            00
                        </span>

                        <span class="countdown-label">
                            Days
                        </span>

                    </div>


                    <span class="countdown-separator">
                        :
                    </span>


                    <div class="countdown-item">

                        <span
                            id="hours"
                            class="countdown-number">
                            00
                        </span>

                        <span class="countdown-label">
                            Hours
                        </span>

                    </div>


                    <span class="countdown-separator">
                        :
                    </span>


                    <div class="countdown-item">

                        <span
                            id="minutes"
                            class="countdown-number">
                            00
                        </span>

                        <span class="countdown-label">
                            Minutes
                        </span>

                    </div>


                    <span class="countdown-separator">
                        :
                    </span>


                    <div class="countdown-item">

                        <span
                            id="seconds"
                            class="countdown-number">
                            00
                        </span>

                        <span class="countdown-label">
                            Seconds
                        </span>

                    </div>

                </div>

            </section>


            <!-- =================================================
                 BEFORE VENUE
                 ================================================= -->

            <section class="before-venue-section reveal">

                <img
                    src="before-venue.png"
                    alt="تفاصيل إضافية">

            </section>


            <!-- =================================================
                 VENUE
                 ================================================= -->

            <section class="venue-section reveal">


                <h2 class="venue-title">

                    قاعة حفلات روايال بن فليس

                </h2>


                <img
                    class="venue-photo"
                    src="venue-photo.png"
                    alt="قاعة حفلات روايال بن فليس">


                <!-- Google Maps -->

                <a
                    class="maps-button"

                    href="https://maps.app.goo.gl/Snd3eM9tPxZ7RBir8"

                    target="_blank"

                    rel="noopener noreferrer">

                    <span>📍</span>

                    <span>
                        اضغط للتوجه للمكان
                    </span>

                </a>


            </section>


            <!-- =================================================
                 INSTRUCTIONS
                 ================================================= -->

            <section class="instructions-section reveal">

                <img
                    src="instructions.png"
                    alt="تعليمات الزفاف">

            </section>


            <!-- =================================================
                 FINAL
                 ================================================= -->

            <section class="final-section reveal">

                <div class="final-content">


                    <div
                        class="final-hearts"
                        aria-hidden="true">

                        <span>♡</span>
                        <span>♥</span>
                        <span>♡</span>

                    </div>


                    <h2 class="final-title">

                        ننتظر قدومكم

                    </h2>


                    <div class="final-names">

                        Samir
                        <span>&amp;</span>
                        Huda

                    </div>


                    <div
                        class="final-hearts final-hearts-bottom"
                        aria-hidden="true">

                        <span>♡</span>
                        <span>♥</span>
                        <span>♡</span>

                    </div>


                </div>

            </section>


        </div>

    </div>

</main>


<script>


/* =====================================================
   ELEMENTS
   ===================================================== */

const coverScreen =
    document.getElementById("coverScreen");

const invitation =
    document.getElementById("invitation");

const music =
    document.getElementById("weddingMusic");

const musicToggle =
    document.getElementById("musicToggle");


let invitationOpened = false;


/* =====================================================
   OPEN INVITATION
   ===================================================== */

async function openInvitation(){

    if(invitationOpened){
        return;
    }

    invitationOpened = true;


    try{

        music.volume = 0.75;

        await music.play();

        musicToggle.setAttribute(
            "aria-label",
            "إيقاف الموسيقى"
        );

        musicToggle.setAttribute(
            "aria-pressed",
            "true"
        );

    }

    catch(error){

        musicToggle.setAttribute(
            "aria-label",
            "تشغيل الموسيقى"
        );

        musicToggle.setAttribute(
            "aria-pressed",
            "false"
        );

    }


    coverScreen.classList.add("hide");

    invitation.classList.add("open");

    document.body.classList.remove("locked");


    window.scrollTo({
        top:0,
        behavior:"instant"
    });


    const firstReveal =
        document.querySelector(".reveal");


    if(firstReveal){

        firstReveal.classList.add("visible");

    }

}


/* =====================================================
   COVER CLICK
   ===================================================== */

coverScreen.addEventListener(
    "click",
    openInvitation
);


/* =====================================================
   COVER KEYBOARD
   ===================================================== */

coverScreen.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" ||
            event.key === " "
        ){

            event.preventDefault();

            openInvitation();

        }

    }
);


/* =====================================================
   MUSIC CONTROL
   ===================================================== */

musicToggle.addEventListener(
    "click",
    async function(event){

        event.stopPropagation();


        if(music.paused){

            try{

                await music.play();

                musicToggle.setAttribute(
                    "aria-label",
                    "إيقاف الموسيقى"
                );

                musicToggle.setAttribute(
                    "aria-pressed",
                    "true"
                );

            }

            catch(error){

                console.log(
                    "تعذر تشغيل الموسيقى:",
                    error
                );

            }

        }

        else{

            music.pause();

            musicToggle.setAttribute(
                "aria-label",
                "تشغيل الموسيقى"
            );

            musicToggle.setAttribute(
                "aria-pressed",
                "false"
            );

        }

    }
);


/* =====================================================
   COUNTDOWN
   تاريخ الزواج:
   11 أكتوبر 2026
   الساعة 15:00
   ===================================================== */

const weddingDate =
    new Date(
        2026,
        9,
        11,
        15,
        0,
        0
    );


const daysElement =
    document.getElementById("days");

const hoursElement =
    document.getElementById("hours");

const minutesElement =
    document.getElementById("minutes");

const secondsElement =
    document.getElementById("seconds");


function updateCountdown(){

    const now =
        new Date();


    let difference =
        weddingDate.getTime()
        -
        now.getTime();


    if(difference < 0){

        difference = 0;

    }


    const totalSeconds =
        Math.floor(
            difference / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400)
            / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600)
            / 60
        );


    const seconds =
        totalSeconds % 60;


    daysElement.textContent =
        String(days).padStart(2,"0");


    hoursElement.textContent =
        String(hours).padStart(2,"0");


    minutesElement.textContent =
        String(minutes).padStart(2,"0");


    secondsElement.textContent =
        String(seconds).padStart(2,"0");

}


updateCountdown();

setInterval(
    updateCountdown,
    1000
);


/* =====================================================
   SCROLL REVEAL
   ===================================================== */

const revealObserver =
    new IntersectionObserver(

        function(entries){

            entries.forEach(
                function(entry){

                    if(entry.isIntersecting){

                        entry.target.classList.add(
                            "visible"
                        );

                        revealObserver.unobserve(
                            entry.target
                        );

                    }

                }
            );

        },

        {
            threshold:0.10,

            rootMargin:
                "0px 0px -7% 0px"
        }

    );


document
    .querySelectorAll(".reveal")
    .forEach(
        function(element){

            revealObserver.observe(
                element
            );

        }
    );

</script>

</body>
</html>
